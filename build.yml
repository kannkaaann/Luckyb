name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: ビルド
        shell: bash
        run: gradle build --console=plain 2>&1 | tee build.log
      - name: エラー部分だけ表示(失敗時)
        if: failure()
        shell: bash
        run: |
          echo "===== ここから下を貼ってください ====="
          grep -n -E "error:|warning: \[|What went wrong|FAILED|Could not|Caused by" build.log | head -60
          echo "----- エラー詳細 -----"
          grep -n -A8 "What went wrong" build.log | head -40
          echo "===== ここまで ====="
      - uses: actions/upload-artifact@v5
        with:
          name: luckylobby-jar
          path: build/libs/*.jar
