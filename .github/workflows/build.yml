name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Fantasy の公開バージョン一覧(確認用)
        continue-on-error: true
        run: curl -s https://maven.nucleoid.xyz/xyz/nucleoid/fantasy/maven-metadata.xml | grep "<version>"
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: luckylobby-jar
          path: build/libs/*.jar
